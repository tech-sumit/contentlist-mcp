# Bring up SearXNG (the free metasearch backend) + the MCP server together.
#   docker compose up --build
# The MCP server is then reachable at http://localhost:8000/mcp
services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      # Bind IPv4 explicitly — the granian-based image fails to start on Docker
      # hosts without IPv6 (common in CI/cloud) otherwise.
      - GRANIAN_HOST=0.0.0.0
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped

  contentlist-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SEARXNG_URL=http://searxng:8080
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - MCP_TRANSPORT=streamable-http
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - searxng
    restart: unless-stopped
