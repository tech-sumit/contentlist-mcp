[project]
name = "contentlist-mcp"
version = "0.1.0"
description = "A free 'search engine for AI agents' — an MCP server that turns a query into a ranked, deduped, cited content list (top news today, what's new in songs)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "tech-sumit" }]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "python-dateutil>=2.9",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Optional Claude Haiku summaries — the server stays free/extractive without this.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
contentlist-mcp = "contentlist_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contentlist_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
