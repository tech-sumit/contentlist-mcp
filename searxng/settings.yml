# Minimal SearXNG config for contentlist-mcp.
# IMPORTANT: the `json` format is required so the MCP server can read results.
# Change `secret_key` before any non-local deployment.
use_default_settings: true

server:
  secret_key: "change-me-please-generate-a-random-secret"
  limiter: false
  image_proxy: true

search:
  safe_search: 1
  formats:
    - html
    - json
